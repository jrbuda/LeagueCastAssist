# LeagueCastAssist media server -- https://lca.budaslounge.com
#
# Same shape as voicebots.conf: Cloudflare terminates TLS and speaks http to
# this origin, Apache proxies everything to the loopback service, and the
# existing wildcard certificate for *.budaslounge.com is reused, so there is
# no new certificate to issue or renew.
#
# The namespace is deliberately "/" on this host: /music/... and /media/...
# are served by the service, and /assets/... can join later without moving
# anything or adding another vhost.

<VirtualHost *:80>
    ServerName lca.budaslounge.com
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/lca-error.log
    CustomLog ${APACHE_LOG_DIR}/lca-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lca.budaslounge.com
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/budaslounge.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/budaslounge.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Cloudflare terminates TLS, so tell the service the real scheme and keep
    # the Host the client asked for.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    ProxyPass        / http://127.0.0.1:38030/ retry=0
    ProxyPassReverse / http://127.0.0.1:38030/

    # Media is up to 61 MB per file on a home upstream: give slow transfers room
    # instead of Apache's 60 s default.
    ProxyTimeout 300
    Timeout 600

    # Big reads should stream, not buffer, and nothing here needs keep-alive
    # tuning beyond the defaults.
    ProxyIOBufferSize 65536

    ErrorLog  ${APACHE_LOG_DIR}/lca-error.log
    CustomLog ${APACHE_LOG_DIR}/lca-access.log combined
</VirtualHost>
